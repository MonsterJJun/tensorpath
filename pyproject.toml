[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "tensorpath-local"
version = "0.2.1"
description = "Evidence-first PyTorch tracing and agent-first MCP analysis"
readme = "README.md"
requires-python = ">=3.10"
license = {file = "LICENSE"}
dependencies = []

[project.optional-dependencies]
record = ["torch>=2.2,<3"]
mcp = ["mcp>=1.12,<2"]
setup = ["ruamel.yaml>=0.18,<0.20"]
test = ["pytest>=8,<10", "ruamel.yaml>=0.18,<0.20"]

[project.scripts]
tensorpath = "tensorpath.cli:main"
tensorpath-mcp = "tensorpath.server:main"

[tool.setuptools]
packages = ["tensorpath", "tensorpath_skills"]
package-dir = {tensorpath = "src/tensorpath", tensorpath_skills = "skills"}

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.setuptools.package-data]
tensorpath = ["web/*.html"]

tensorpath_skills = ["*/SKILL.md"]
