name: Tests
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ['3.10', '3.12']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install ".[record,mcp,test]"
      - run: python -m pytest -q
      - run: python examples/tiny_transformer.py --root traces
      - run: tensorpath --root traces diagnose detached
      - run: python examples/forward_only.py --root forward_traces
      - run: tensorpath --root examples/sample_traces visualize healthy --include detached --output explorer.html
      - if: matrix.os == 'ubuntu-latest' && matrix.python == '3.12'
        run: |
          python -m pip install playwright
          python -m playwright install --with-deps chromium
          python tests/browser_smoke.py
